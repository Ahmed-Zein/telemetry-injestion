services:
  postgres:
    image: postgres:16-alpine
    container_name: cypod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: cypod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cypod"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
